name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write        # only to create the release

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # A release that fails its own tests should never exist.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See the Releases section of the README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      # versionName and versionCode come from GITHUB_REF_NAME, which Actions sets
      # to the tag; app/build.gradle.kts derives both from it.
      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the artefact after the tag
        run: |
          # Gradle writes app-release-unsigned.apk when it has no key, so the
          # signed name existing is itself the check that signing happened.
          test -f app/build/outputs/apk/release/app-release.apk \
            || { echo "::error::built APK is unsigned; check the signing secrets"; exit 1; }
          mv app/build/outputs/apk/release/app-release.apk "kettenblatt-${GITHUB_REF_NAME#v}.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "kettenblatt-${GITHUB_REF_NAME#v}.apk" \
            --title "Kettenblatt ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"
