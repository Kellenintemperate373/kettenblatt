name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  preprocessing:
    name: preprocessing (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tools/ is stdlib-only by design; pytest is the single dev dependency.
      - run: pip install pytest
      - run: python -m pytest tests/ -q
        working-directory: tools

  app:
    name: app (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # No local.properties in the repo; the runner's ANDROID_HOME supplies the SDK.
      - run: ./gradlew :app:testDebugUnitTest --no-daemon
