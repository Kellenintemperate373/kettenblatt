services:
  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: naviapp-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./custom_files:/custom_files
    environment:
      # Geofabrik extracts to build the routing graph from.
      # Limburg (NL, 95 MB) covers the Venlo area. Space-separate more URLs to widen
      # coverage, e.g. add the German side if you ride across the border:
      #   https://download.geofabrik.de/europe/germany/nordrhein-westfalen/duesseldorf-regbez-latest.osm.pbf
      tile_urls: "https://download.geofabrik.de/europe/netherlands/limburg-latest.osm.pbf"
      # SRTM elevation. Off by default: the Venlo route climbs 68 m so it buys nothing,
      # but flip to "True" for Alpine trips to get better elevation than Komoot's
      # quantised values, served via Valhalla's /height endpoint.
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
      # Set to "True" after the first successful build to skip rebuilding on restart.
      use_tiles_ignore_pbf: "False"
      server_threads: "4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
